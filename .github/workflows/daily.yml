name: Daily news headline candidates
on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: headline-candidates
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect candidates without overwriting editorial reports
        run: |
          python scripts/collect.py
          mv news.json candidates.json
          git restore news.json
      - name: Commit candidate index only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add candidates.json
          if ! git diff --cached --quiet; then
            git commit -m "Update headline candidates"
            git pull --rebase origin main
            git push
          fi
