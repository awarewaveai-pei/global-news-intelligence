name: Hourly AI intelligence candidates
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ai-intelligence
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect AI release notes and benefits candidates
        run: python scripts/collect_ai.py
      - name: Commit AI feed changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh AI intelligence candidates"
            git pull --rebase origin main
            git push
          fi
