<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>全球 AI、科技與重大新聞監測</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#15243a;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}header{position:sticky;top:0;background:#101f38;color:white;padding:16px 4vw;z-index:4;box-shadow:0 2px 15px #0002}h1{font-size:clamp(19px,3vw,28px);margin:0 0 8px}header p{margin:0;color:#d4dfed;font-size:13px}.wrap{max-width:1160px;margin:auto;padding:18px}nav{display:flex;gap:8px;overflow-x:auto;padding:8px 0 15px}button,input{font:inherit}button{border:1px solid #c7d2e2;background:white;border-radius:12px;padding:10px 14px;cursor:pointer;white-space:nowrap}button.active{background:#1254ad;color:white;border-color:#1254ad}#search{width:100%;border:1px solid #ccd7e6;border-radius:12px;padding:13px}.bar{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}section{margin:20px 0 28px}h2{font-size:21px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:13px}article{background:white;border:1px solid #e0e7f2;border-radius:15px;padding:16px;box-shadow:0 3px 13px #172e4a0a}article h3{font-size:16px;line-height:1.5;margin:8px 0}small{color:#63758e}a{color:#1254ad}a:hover{text-decoration:underline}.tag{display:inline-block;background:#edf3fc;color:#174b89;padding:3px 8px;border-radius:8px;font-size:12px}.note{background:#fff8e9;border:1px solid #f0d7a3;border-radius:12px;padding:13px;margin-top:15px;font-size:14px}details{margin-top:10px}summary{cursor:pointer;color:#1254ad}footer{color:#52647a;font-size:13px;padding:28px 0}</style></head><body><header><h1>全球 AI、科技與重大新聞監測</h1><p>Global News Intelligence · 台灣與國際12領域 · 每類最多5則</p></header><main class="wrap"><div class="bar"><h2 id="status">新聞儀表板</h2><small id="updated">資料載入中…</small></div><div class="note" id="notice">本網站自動蒐集公開新聞索引，並非經人工查證的完整新聞報告。ChatGPT 深度快報與本網站更新流程獨立。</div><nav id="regions"><button class="active" data-region="all">全部</button><button data-region="tw">台灣</button><button data-region="int">國際</button><button data-region="fav">收藏</button></nav><input id="search" type="search" placeholder="搜尋標題、來源與摘要"><nav id="categories"></nav><div id="results" aria-live="polite"></div><footer>報導版權屬原新聞來源。請由來源連結查看全文；新聞索引不代表立場或確認事實。收藏僅儲存在這台裝置的瀏覽器。</footer></main><script>const cats=[['tw-policy','政府政策與法規'],['tw-economy','台灣經濟金融'],['tw-tech','科技與半導體'],['tw-security','國防與兩岸'],['tw-safety','民生與公共安全'],['tw-social','教育與社會'],['int-politics','國際政治與外交'],['int-security','全球安全'],['int-economy','全球經濟金融'],['int-tech','科技產業競爭'],['int-energy','能源與氣候'],['int-regulation','國際制度與法規']];let news=[],region='all',category='all',q='';let fav=new Set(JSON.parse(localStorage.getItem('news-favs')||'[]'));const e=id=>document.getElementById(id);const label=id=>cats.find(c=>c[0]===id)?.[1]||id;function el(tag,cl,txt){let x=document.createElement(tag);if(cl)x.className=cl;if(txt!=null)x.textContent=txt;return x}function render(){e('categories').replaceChildren();let c=el('button',category==='all'?'active':'','所有領域');c.onclick=()=>{category='all';render()};e('categories').append(c);cats.filter(x=>region==='all'||region==='fav'||x[0].startsWith(region)).forEach(([id,name])=>{let b=el('button',category===id?'active':'',name);b.onclick=()=>{category=id;render()};e('categories').append(b)});const filtered=news.filter(a=>(region==='all'||region==='fav'||a.category.startsWith(region))&&(region!=='fav'||fav.has(a.id))&&(category==='all'||a.category===category)&&[a.title,a.source,a.summary].join(' ').toLowerCase().includes(q));e('status').textContent='符合條件 '+filtered.length+' 則';e('results').replaceChildren();if(!filtered.length){e('results').append(el('p','',news.length?'此分類目前沒有符合條件的新聞。':'目前尚無新聞索引。可於 GitHub Actions 手動執行每日蒐集。'));return}for(const [id,name] of cats){const arr=filtered.filter(a=>a.category===id);if(!arr.length)continue;let s=el('section'),h=el('h2','',name+' · '+arr.length+' 則'),grid=el('div','cards');s.append(h,grid);arr.forEach(a=>{let card=el('article'),tag=el('span','tag',name),date=el('small','',a.published_at||'日期未確認'),title=el('h3','',a.title),desc=el('p','',a.summary||''),link=el('a','', '閱讀來源 ↗');link.href=a.url;link.target='_blank';link.rel='noopener noreferrer';let save=el('button','',fav.has(a.id)?'★ 已收藏':'☆ 收藏');save.onclick=()=>{if(fav.has(a.id))fav.delete(a.id);else fav.add(a.id);localStorage.setItem('news-favs',JSON.stringify([...fav]));render()};card.append(tag,el('p','',date.textContent+' · '+(a.source||'來源未確認')),title,desc,link,el('p'));card.lastChild.append(save);if(a.background||a.impact||a.follow_up){let d=el('details'),sm=el('summary','','查看更多');d.append(sm);for(let [l,k] of [['背景','background'],['影響','impact'],['後續觀察','follow_up']])if(a[k])d.append(el('p','',l+'：'+a[k]));card.append(d)}grid.append(card)});e('results').append(s)}}document.querySelectorAll('[data-region]').forEach(b=>b.onclick=()=>{region=b.dataset.region;category='all';document.querySelectorAll('[data-region]').forEach(x=>x.classList.toggle('active',x===b));render()});e('search').oninput=x=>{q=x.target.value.trim().toLowerCase();render()};fetch('./news.json?ts='+Date.now()).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(d=>{news=Array.isArray(d.articles)?d.articles.filter(a=>a.title&&/^https:\/\//.test(a.url)&&cats.some(c=>c[0]===a.category)):[];e('updated').textContent='更新：'+(d.updated_at||'尚無資料');e('notice').textContent=d.notice||'新聞索引尚未完成獨立查證，請依原始來源核對。';render()}).catch(err=>{e('updated').textContent='資料載入失敗';e('notice').textContent='目前無法取得新聞資料：'+err.message;render()});</script></body></html>
